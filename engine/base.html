<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dos perfiles discutiendo — Cartoon Engine</title>
<style>
  :root { color-scheme: dark; --ink:#f5f2e9; --muted:#8d96a8; --left:#ff5a4f; --right:#56b8ff; --panel:#151922; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#090b10; color:var(--ink); font:15px/1.35 system-ui,sans-serif; }
  main { width:min(920px,100%); padding:18px; }
  .stage { position:relative; overflow:hidden; border:1px solid #2b3240; border-radius:22px; background:radial-gradient(circle at 50% 42%,#202633 0,#11151d 54%,#0b0e14 100%); }
  svg { display:block; width:100%; height:auto; }
  .face { fill:none; stroke:currentColor; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
  .left { color:var(--left); transform-origin:250px 260px; }
  .right { color:var(--right); transform-origin:650px 260px; }
  .node { fill:#0d1016; stroke:currentColor; stroke-width:5; }
  .eye { fill:currentColor; }
  .mouth { transform-box:fill-box; transform-origin:center; }
  .brow,.jaw,.head { transition:transform 160ms ease; }
  .speaker .jaw { transform:translateY(8px); }
  .speaker .brow { transform:translateY(-5px) rotate(-8deg); }
  .speaker.head { transform:translateX(6px) rotate(1.8deg); }
  .right.speaker .brow { transform:translateY(-5px) rotate(8deg); }
  .right.speaker.head { transform:translateX(-6px) rotate(-1.8deg); }
  .speaker .mouth { animation:talk .26s steps(2,end) infinite; }
  .overlap .mouth { animation-duration:.18s; }
  @keyframes talk { 50% { transform:scaleY(1.8); } }
  .sound { opacity:0; stroke:currentColor; stroke-width:5; stroke-linecap:round; transition:opacity 120ms ease; }
  .speaker .sound { opacity:1; animation:pulse .52s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity:.35; transform:translateX(5px); } }
  .right .sound { transform-origin:center; }
  .clock { display:flex; justify-content:center; gap:9px; padding:14px 12px 4px; }
  .beat { width:13px; height:13px; border-radius:50%; background:#303746; border:2px solid #596174; }
  .beat.on { background:#fff; border-color:#fff; box-shadow:0 0 14px #fff8; }
  .label { min-height:24px; text-align:center; color:#cbd1dc; letter-spacing:.04em; }
  .controls { display:flex; justify-content:center; gap:10px; padding:12px; }
  button { border:1px solid #384052; border-radius:999px; padding:8px 15px; background:#1a202b; color:var(--ink); cursor:pointer; }
  button:hover { background:#252d3a; }
  @media (prefers-reduced-motion:reduce) { .mouth,.sound { animation:none!important; } }
</style>
</head>
<body>
<main>
  <section class="stage" aria-label="Dos rostros de perfil enfrentados discutiendo">
    <svg viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
      <title id="title">Dos perfiles discutiendo</title>
      <desc id="desc">Dos rostros construidos con líneas y puntos alternan sus intervenciones siguiendo cinco pulsos.</desc>
      <path d="M450 76V440" stroke="#303746" stroke-width="2" stroke-dasharray="6 12"/>
      <g id="leftFace" class="face left head">
        <path d="M128 414 Q107 342 120 265 Q132 178 211 132 Q277 95 339 132 Q372 151 378 191"/>
        <path d="M378 191 L361 232 L397 253 L365 274"/>
        <g class="jaw"><path d="M365 274 Q392 296 360 314 L329 321 Q371 345 334 379 Q299 411 248 414"/></g>
        <circle class="node" cx="365" cy="274" r="9"/>
        <circle class="eye" cx="333" cy="220" r="7"/>
        <path class="brow" d="M310 197 Q337 184 360 196"/>
        <g class="mouth"><path d="M342 292 Q365 300 383 290"/></g>
        <g class="sound"><path d="M412 274h20"/><path d="M410 294l27 10"/></g>
      </g>
      <g id="rightFace" class="face right head">
        <path d="M772 414 Q793 342 780 265 Q768 178 689 132 Q623 95 561 132 Q528 151 522 191"/>
        <path d="M522 191 L539 232 L503 253 L535 274"/>
        <g class="jaw"><path d="M535 274 Q508 296 540 314 L571 321 Q529 345 566 379 Q601 411 652 414"/></g>
        <circle class="node" cx="535" cy="274" r="9"/>
        <circle class="eye" cx="567" cy="220" r="7"/>
        <path class="brow" d="M590 197 Q563 184 540 196"/>
        <g class="mouth"><path d="M558 292 Q535 300 517 290"/></g>
        <g class="sound"><path d="M488 274h-20"/><path d="M490 294l-27 10"/></g>
      </g>
    </svg>
    <div class="clock" aria-label="Clock de cinco pulsos">
      <i class="beat"></i><i class="beat"></i><i class="beat"></i><i class="beat"></i><i class="beat"></i>
    </div>
    <div id="label" class="label" aria-live="polite">Empieza la discusión</div>
    <div class="controls">
      <button id="toggle" type="button">Pausar</button>
      <button id="restart" type="button">Reiniciar</button>
    </div>
  </section>
</main>
<script>
(() => {
  const left = document.querySelector('#leftFace');
  const right = document.querySelector('#rightFace');
  const beats = [...document.querySelectorAll('.beat')];
  const label = document.querySelector('#label');
  const toggle = document.querySelector('#toggle');
  const restart = document.querySelector('#restart');
  const states = [
    { who:'left', text:'Habla el perfil rojo' },
    { who:'right', text:'Responde el perfil azul' },
    { who:'both', text:'Los dos hablan a la vez' },
    { who:'right', text:'El perfil azul remarca su respuesta' },
    { who:'none', text:'Pausa' }
  ];
  let beat = -1;
  let timer;
  let running = true;

  function render() {
    const state = states[beat];
    left.classList.toggle('speaker', state.who === 'left' || state.who === 'both');
    right.classList.toggle('speaker', state.who === 'right' || state.who === 'both');
    left.classList.toggle('overlap', state.who === 'both');
    right.classList.toggle('overlap', state.who === 'both');
    beats.forEach((dot, i) => dot.classList.toggle('on', i === beat));
    label.textContent = 'Clock ' + (beat + 1) + '/5 · ' + state.text;
  }
  function step() { beat = (beat + 1) % states.length; render(); }
  function start() { clearInterval(timer); timer = setInterval(step, 900); }
  toggle.addEventListener('click', () => {
    running = !running;
    toggle.textContent = running ? 'Pausar' : 'Continuar';
    if (running) start(); else clearInterval(timer);
  });
  restart.addEventListener('click', () => { beat = -1; step(); if (running) start(); });
  step();
  start();
})();
</script>
</body>
</html>
