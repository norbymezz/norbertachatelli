<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartoon Engine — Cuatro personas articuladas en perspectiva</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#172131;--ink:#edf4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
main{min-height:100vh;display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;gap:.7rem;padding:.75rem 1rem;background:var(--panel);flex-wrap:wrap}
button{border:0;border-radius:.5rem;padding:.55rem .9rem;font:inherit;cursor:pointer}.clock-panel{margin-left:auto;display:flex;align-items:center;gap:.7rem}
#clockCount{display:grid;place-items:center;width:42px;height:42px;border:2px solid #6bd8ff;border-radius:50%;font-size:22px;font-weight:800}
#ticks{display:flex;gap:4px}.tick{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#29384b;color:#9fb1c5;font-size:12px;font-weight:700}.tick.on{background:#ffd166;color:#17202b}
.note{color:#b9c7d8}#turnLabel{min-width:112px;padding:.42rem .65rem;border-radius:.45rem;background:#26364a;text-align:center;font-weight:750}
svg{width:100%;height:100%;min-height:500px;background:linear-gradient(#203149 0 39%,#101720 39%)}.board-edge{fill:#221b16;stroke:#b88d57;stroke-width:5}
.label{fill:#cbd7e4;font-size:15px;font-weight:700;text-anchor:middle}.shadow{fill:#05080d;opacity:.35}
.piece{filter:drop-shadow(0 3px 3px #0008)}
.light-piece{--face-fill:#fff;--face-stroke:#171b23;--feature:#171b23}
.dark-piece{--face-fill:#080a0e;--face-stroke:#fff;--feature:#fff}
.face-head{fill:var(--face-fill);stroke:var(--face-stroke);stroke-width:5}
.face-line{fill:none;stroke:var(--feature);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:var(--feature)}.joint{fill:var(--face-fill);stroke:var(--feature);stroke-width:3}
.bone{stroke:var(--feature);stroke-width:7;stroke-linecap:round}.body-joint{fill:var(--face-fill);stroke:var(--feature);stroke-width:3}
.hair{fill:var(--feature);stroke:var(--face-stroke);stroke-width:3;stroke-linejoin:round}.sclera{fill:#fff;stroke:#171b23;stroke-width:2}.pupil{fill:#171b23}
.sclera,.pupil{transform-box:fill-box;transform-origin:center;transition:transform .05s}.piece.blink .sclera,.piece.blink .pupil{transform:scaleY(.12)}
.speech{opacity:0;pointer-events:none;transition:opacity .12s}.piece.speaking .speech{opacity:1}.speech rect{fill:#fff;stroke:#171b23;stroke-width:3}.speech text{fill:#171b23;font-size:13px;font-weight:900;text-anchor:middle}
.route-dark,.route-light{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 8;opacity:.55}.route-dark{stroke:#66d3ff}.route-light{stroke:#fff0be}
</style>
</head>
<body><main>

  <circle class="body-joint" cx="-15" cy="32" r="5"/><circle class="body-joint" cx="15" cy="32" r="5"/><circle class="body-joint" cx="-20" cy="50" r="5"/><circle class="body-joint" cx="20" cy="50" r="5"/>

<g id="lightFace" class="piece light-piece"><ellipse class="shadow" cx="0" cy="51" rx="31" ry="7"/>
  <line class="bone" x1="0" y1="-47" x2="0" y2="15"/>
  <line class="bone" x1="0" y1="-31" x2="-27" y2="-5"/><line class="bone" x1="-27" y1="-5" x2="-34" y2="22"/>
  <line class="bone" x1="0" y1="-31" x2="27" y2="-5"/><line class="bone" x1="27" y1="-5" x2="34" y2="22"/>
  <line class="bone" x1="0" y1="15" x2="-15" y2="32"/><line class="bone" x1="-15" y1="32" x2="-20" y2="50"/>

  <line class="bone" x1="0" y1="-47" x2="0" y2="15"/>
  <line class="bone" x1="0" y1="-31" x2="-27" y2="-5"/><line class="bone" x1="-27" y1="-5" x2="-34" y2="22"/>

<script>
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const corners={backLeft:[330,90],backRight:[630,90],frontLeft:[70,500],frontRight:[890,500]};
const pieces=[
 {id:"darkFace",start:[1,7],velocity:[-1,-2]},
 {id:"lightFace",start:[1,0],velocity:[2,1]},
 {id:"darkFace2",start:[6,7],velocity:[-2,-1]},
 {id:"lightFace2",start:[6,0],velocity:[1,2]}
];
const state={running:true,origin:performance.now(),pausedAt:0,tickDuration:.8,moveDuration:.55};
function mix(a,b,t){return a+(b-a)*t}function surfacePoint(u,v){const left=[mix(corners.backLeft[0],corners.frontLeft[0],v),mix(corners.backLeft[1],corners.frontLeft[1],v)],right=[mix(corners.backRight[0],corners.frontRight[0],v),mix(corners.backRight[1],corners.frontRight[1],v)];return[mix(left[0],right[0],u),mix(left[1],right[1],u)]}
function cellPoint(name){const col=name.charCodeAt(0)-65,row=Number(name.slice(1))-1;return surfacePoint((col+.5)/8,1-(row+.5)/8)}
function add(tag,attrs,parent){const node=document.createElementNS(NS,tag);for(const[key,value]of Object.entries(attrs))node.setAttribute(key,value);parent.appendChild(node);return node}
function drawBoard(){const board=$("board");add("polygon",{class:"board-edge",points:[corners.backLeft,corners.backRight,corners.frontRight,corners.frontLeft].map(p=>p.join(",")).join(" ")},board);
for(let row=0;row<8;row++)for(let col=0;col<8;col++){const u0=col/8,u1=(col+1)/8,v0=row/8,v1=(row+1)/8,points=[surfacePoint(u0,v0),surfacePoint(u1,v0),surfacePoint(u1,v1),surfacePoint(u0,v1)];add("polygon",{points:points.map(p=>p.join(",")).join(" "),fill:(row+col)%2?"#b6895c":"#ead8b9",stroke:"#614a35","stroke-width":".7"},board)}
for(let col=0;col<8;col++){const p=surfacePoint((col+.5)/8,1.035),t=add("text",{x:p[0],y:p[1]+17,class:"label"},board);t.textContent=String.fromCharCode(65+col)}
for(let row=0;row<8;row++){const p=surfacePoint(-.035,1-(row+.5)/8),t=add("text",{x:p[0]-8,y:p[1]+5,class:"label"},board);t.textContent=row+1}
const routeByPiece={lightFace:"lightRoute",darkFace:"darkRoute",lightFace2:"lightRoute2",darkFace2:"darkRoute2"};
pieces.forEach((piece,pieceIndex)=>{const points=[];for(let i=0;i<Math.min(100,timeline.length);i++){const cell=timeline[i].positions[pieceIndex],point=gridPoint(cell),key=point.join(",");if(points.at(-1)!==key)points.push(key)}$(routeByPiece[piece.id]).setAttribute("points",points.join(" "))})}
function smooth(t){return t*t*(3-2*t)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function gridPoint(cell){return surfacePoint((cell[0]+.5)/8,1-(cell[1]+.5)/8)}
function reflectedCoordinate(value){let result=value;while(result<0||result>7){if(result<0)result=-1-result;if(result>7)result=15-result}return result}
function buildTimeline(length){
 const positions=pieces.map(piece=>[...piece.start]),velocities=pieces.map(piece=>[...piece.velocity]);
 const frames=[{positions:positions.map(p=>[...p]),recovery:false,actor:null,waiting:null}];
 for(let step=0;step<length;step++){
  const pulse=step%5+1;let recovery=false,actor=null;
  if(pulse<5){
   const index=pulse-1,current=positions[index],velocity=velocities[index],proposal=[current[0]+velocity[0],current[1]+velocity[1]];
   const outsideX=proposal[0]<0||proposal[0]>7,outsideY=proposal[1]<0||proposal[1]>7;
   const stepVector=[outsideX?-velocity[0]:velocity[0],outsideY?-velocity[1]:velocity[1]];
   const target=[current[0]+stepVector[0],current[1]+stepVector[1]];
   positions[index]=target;actor=index;recovery=outsideX||outsideY;
   if(!outsideX&&(target[0]===0||target[0]===7))velocity[0]*=-1;
   if(!outsideY&&(target[1]===0||target[1]===7))velocity[1]*=-1;
  }
  frames.push({positions:positions.map(p=>[...p]),recovery,actor,waiting:null});
 }
 return frames;
}
const timeline=buildTimeline(6000);
const phrases=["¡Voy!","¡Ahora!","¡Salto!","¡Allá!"];
function addSpeechBubbles(){pieces.forEach((piece,index)=>{const bubble=add("g",{class:"speech"},$(piece.id));add("rect",{x:-35,y:-143,width:70,height:27,rx:11},bubble);const text=add("text",{x:0,y:-125,class:"speech-text"},bubble);text.textContent=phrases[index]})}
function updateClock(t,beatIndex){const count=beatIndex%5+1,event=timeline[beatIndex+1],actor=event.actor===null?null:pieces[event.actor],team=actor?(actor.id.startsWith("light")?"blancas":"negras"):"";$("clockCount").value=count===5?"—":count;$("turnLabel").value=count===5?"Pausa":event.recovery?"Rebote "+team:"Turno "+team;document.querySelectorAll(".tick").forEach((node,i)=>node.classList.toggle("on",i+1===count))}
function perspectiveScale(y){const depth=clamp((y-corners.backLeft[1])/(corners.frontLeft[1]-corners.backLeft[1]),0,1);return mix(.48,1.02,depth)}
function render(t){const beatIndex=Math.min(Math.floor(t/state.tickDuration),timeline.length-2),beatTime=t-beatIndex*state.tickDuration,progress=smooth(clamp(beatTime/state.moveDuration,0,1));updateClock(t,beatIndex);
 pieces.forEach((piece,index)=>{const startCell=timeline[beatIndex].positions[index],endCell=timeline[beatIndex+1].positions[index],a=gridPoint(startCell),b=gridPoint(endCell),p={x:mix(a[0],b[0],progress),y:mix(a[1],b[1],progress)},scale=perspectiveScale(p.y),el=$(piece.id),moving=(startCell[0]!==endCell[0]||startCell[1]!==endCell[1])&&beatTime<state.moveDuration,blinkPhase=(t+index*.67)%3.1;
  el.setAttribute("transform",`translate(${p.x} ${p.y}) scale(${scale}) translate(0 -50)`);
  el.classList.toggle("speaking",moving);el.classList.toggle("blink",blinkPhase<.12);
  if(moving)el.querySelector(".speech-text").textContent=timeline[beatIndex+1].recovery?"¡Rebote!":phrases[index]
 })}
function frame(now){if(state.running){state.pausedAt=(now-state.origin)/1000;render(state.pausedAt)}requestAnimationFrame(frame)}
$("toggle").onclick=()=>{state.running=!state.running;if(state.running){state.origin=performance.now()-state.pausedAt*1000;$("toggle").textContent="Pausa"}else $("toggle").textContent="Continuar"};
$("restart").onclick=()=>{state.origin=performance.now();state.pausedAt=0;state.running=true;$("toggle").textContent="Pausa";render(0)};
for(let i=1;i<=5;i++){const node=document.createElement("span");node.className="tick";node.textContent=i===5?"↩":i;$("ticks").appendChild(node)}
addSpeechBubbles();drawBoard();render(0);requestAnimationFrame(frame);
</script></body></html>
