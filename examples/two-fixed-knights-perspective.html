<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartoon Engine — Cuatro caballos en perspectiva</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#172131;--ink:#edf4ff;--light:#e9dfca;--dark:#151a24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
main{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:center;gap:.7rem;padding:.75rem 1rem;background:var(--panel)}
button{border:0;border-radius:.5rem;padding:.55rem .9rem;font:inherit;cursor:pointer}
.clock-panel{margin-left:auto;display:flex;align-items:center;gap:.7rem}
#clockCount{display:grid;place-items:center;width:42px;height:42px;border:2px solid #6bd8ff;border-radius:50%;font-size:22px;font-weight:800}
#ticks{display:flex;gap:4px}
.tick{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#29384b;color:#9fb1c5;font-size:12px;font-weight:700}
.tick.on{background:#ffd166;color:#17202b}
.note{color:#b9c7d8}
svg{width:100%;height:100%;min-height:500px;background:linear-gradient(#203149 0 39%,#101720 39%)}
.board-edge{fill:#221b16;stroke:#b88d57;stroke-width:5}
.label{fill:#cbd7e4;font-size:15px;font-weight:700;text-anchor:middle}
.shadow{fill:#05080d;opacity:.35}
.piece{color:#f7f1e3}
.dark-piece{color:#151a24;filter:drop-shadow(0 0 1.6px #79d8ff)}
.light-piece{color:#fff8e8;filter:drop-shadow(0 0 1.6px #263446)}
.piece .horse-line{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.piece .horse-detail{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.piece .horse-node{fill:currentColor;stroke:#79d8ff;stroke-width:1.6}
.light-piece .horse-node{stroke:#8c7658}
.piece .eye{fill:#ffd166;stroke:#17202b;stroke-width:1}
.piece .nostril{fill:#79d8ff}
.route-dark,.route-light{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 8;opacity:.55}
.route-dark{stroke:#66d3ff}.route-light{stroke:#fff0be}
</style>
</head>
<body>
<main>
<header>
<button id="toggle">Pausa</button>
<button id="restart">Reiniciar</button>
<span class="note">Negro 1 → Negro 2 → Blanco 1 → Blanco 2 → pausa</span>
<div class="clock-panel">
  <div id="ticks"></div>
  <output id="clockCount">1</output>
</div>
</header>
<svg viewBox="0 0 960 560" role="img" aria-label="Cuatro caballos de dos colores recorren un tablero de ajedrez en perspectiva sin rotar ni cambiar de tamaño">
<g id="board"></g>
<polyline id="darkRoute" class="route-dark"/>
<polyline id="darkRoute2" class="route-dark"/>
<polyline id="lightRoute" class="route-light"/>
<polyline id="lightRoute2" class="route-light"/>
<defs>
  <g id="knightProfile">
    <ellipse class="shadow" cx="0" cy="16" rx="36" ry="9"/>
    <path class="horse-line" d="M-31 12 H34 M-26 10 Q-13 0-18-25 Q-22-42-10-57 L-14-73 L1-62 L11-77 L17-57 Q29-51 40-36 L49-28 L43-20 L29-15 Q19-8 27 3 L33 12"/>
    <path class="horse-detail" d="M-11-55 Q-28-42-18-25 M29-15 Q37-17 43-20"/>
    <circle class="horse-node" cx="-31" cy="12" r="4"/>
    <circle class="horse-node" cx="-18" cy="-25" r="4"/>
    <circle class="horse-node" cx="-10" cy="-57" r="4"/>
    <circle class="horse-node" cx="1" cy="-62" r="4"/>
    <circle class="horse-node" cx="11" cy="-77" r="4"/>
    <circle class="horse-node" cx="17" cy="-57" r="4"/>
    <circle class="horse-node" cx="40" cy="-36" r="4"/>
    <circle class="horse-node" cx="49" cy="-28" r="4"/>
    <circle class="horse-node" cx="43" cy="-20" r="4"/>
    <circle class="horse-node" cx="29" cy="-15" r="4"/>
    <circle class="horse-node" cx="27" cy="3" r="4"/>
    <circle class="horse-node" cx="34" cy="12" r="4"/>
    <circle class="eye" cx="16" cy="-48" r="3.6"/>
    <circle class="nostril" cx="42" cy="-27" r="2.5"/>
  </g>
</defs>
<g id="darkKnight" class="piece dark-piece"><use href="#knightProfile"/></g>
<g id="darkKnight2" class="piece dark-piece"><use href="#knightProfile"/></g>
<g id="lightKnight" class="piece light-piece"><use href="#knightProfile"/></g>
<g id="lightKnight2" class="piece light-piece"><use href="#knightProfile"/></g>
</svg>
</main>
<script>
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const corners={backLeft:[330,90],backRight:[630,90],frontLeft:[70,500],frontRight:[890,500]};
const darkPath=["B1","C3","E4","F6","H5"];
const darkPath2=["G1","F3","D4","C6","A5"];
const lightPath=["G8","E7","C8","B6","D5"];
const lightPath2=["B8","A6","C5","E6","G5"];
const state={running:true,origin:performance.now(),pausedAt:0,tickDuration:.8,moveDuration:.55};

function mix(a,b,t){return a+(b-a)*t}
function surfacePoint(u,v){
 const left=[mix(corners.backLeft[0],corners.frontLeft[0],v),mix(corners.backLeft[1],corners.frontLeft[1],v)];
 const right=[mix(corners.backRight[0],corners.frontRight[0],v),mix(corners.backRight[1],corners.frontRight[1],v)];
 return [mix(left[0],right[0],u),mix(left[1],right[1],u)];
}
function cellPoint(name){
 const col=name.charCodeAt(0)-65;
 const row=Number(name.slice(1))-1;
 return surfacePoint((col+.5)/8,1-(row+.5)/8);
}
function add(tag,attrs,parent){
 const node=document.createElementNS(NS,tag);
 for(const [key,value] of Object.entries(attrs)) node.setAttribute(key,value);
 parent.appendChild(node);return node;
}
function drawBoard(){
 const board=$("board");
 add("polygon",{class:"board-edge",points:[corners.backLeft,corners.backRight,corners.frontRight,corners.frontLeft].map(p=>p.join(",")).join(" ")},board);
 for(let row=0;row<8;row++) for(let col=0;col<8;col++){
   const u0=col/8,u1=(col+1)/8,v0=row/8,v1=(row+1)/8;
   const points=[surfacePoint(u0,v0),surfacePoint(u1,v0),surfacePoint(u1,v1),surfacePoint(u0,v1)];
   add("polygon",{points:points.map(p=>p.join(",")).join(" "),fill:(row+col)%2?"#b6895c":"#ead8b9",stroke:"#614a35","stroke-width":".7"},board);
 }
 for(let col=0;col<8;col++){
   const p=surfacePoint((col+.5)/8,1.035);
   const t=add("text",{x:p[0],y:p[1]+17,class:"label"},board);t.textContent=String.fromCharCode(65+col);
 }
 for(let row=0;row<8;row++){
   const p=surfacePoint(-.035,1-(row+.5)/8);
   const t=add("text",{x:p[0]-8,y:p[1]+5,class:"label"},board);t.textContent=row+1;
 }
 $("darkRoute").setAttribute("points",darkPath.map(cellPoint).map(p=>p.join(",")).join(" "));
 $("darkRoute2").setAttribute("points",darkPath2.map(cellPoint).map(p=>p.join(",")).join(" "));
 $("lightRoute").setAttribute("points",lightPath.map(cellPoint).map(p=>p.join(",")).join(" "));
 $("lightRoute2").setAttribute("points",lightPath2.map(cellPoint).map(p=>p.join(",")).join(" "));
}
function smooth(t){return t*t*(3-2*t)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pingPongPoint(path,index){
 const span=path.length-1;
 const phase=((index%(span*2))+(span*2))%(span*2);
 return cellPoint(path[phase<=span?phase:span*2-phase]);
}
function clockDrivenPosition(path,t,eventBeat){
 const d=state.tickDuration;
 const firstStart=(eventBeat-1)*d;
 if(t<firstStart){const [x,y]=pingPongPoint(path,0);return{x,y}}
 const eventIndex=Math.floor((t-firstStart)/(5*d));
 const eventStart=firstStart+eventIndex*5*d;
 const progress=smooth(clamp((t-eventStart)/state.moveDuration,0,1));
 const a=pingPongPoint(path,eventIndex),b=pingPongPoint(path,eventIndex+1);
 return{x:mix(a[0],b[0],progress),y:mix(a[1],b[1],progress)};
}
function updateClock(t){
 const count=Math.floor(t/state.tickDuration)%5+1;
 $("clockCount").value=count;
 document.querySelectorAll(".tick").forEach((node,i)=>node.classList.toggle("on",i+1===count));
}
function render(t){
 updateClock(t);
 const dark=clockDrivenPosition(darkPath,t,1);
 const dark2=clockDrivenPosition(darkPath2,t,2);
 const light=clockDrivenPosition(lightPath,t,3);
 const light2=clockDrivenPosition(lightPath2,t,4);
 // Invariante: los cuatro transforms contienen solamente traslación.
 $("darkKnight").setAttribute("transform",`translate(${dark.x} ${dark.y})`);
 $("darkKnight2").setAttribute("transform",`translate(${dark2.x} ${dark2.y})`);
 $("lightKnight").setAttribute("transform",`translate(${light.x} ${light.y})`);
 $("lightKnight2").setAttribute("transform",`translate(${light2.x} ${light2.y})`);
}
function frame(now){
 if(state.running){state.pausedAt=(now-state.origin)/1000;render(state.pausedAt)}
 requestAnimationFrame(frame);
}
$("toggle").onclick=()=>{
 state.running=!state.running;
 if(state.running){state.origin=performance.now()-state.pausedAt*1000;$("toggle").textContent="Pausa"}
 else $("toggle").textContent="Continuar";
};
$("restart").onclick=()=>{state.origin=performance.now();state.pausedAt=0;state.running=true;$("toggle").textContent="Pausa";render(0)};
for(let i=1;i<=5;i++){const node=add("span",{class:"tick"},$("ticks"));node.textContent=i===5?"—":i}
drawBoard();render(0);requestAnimationFrame(frame);
</script>
</body>
</html>
